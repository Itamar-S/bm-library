<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חיפוש ספרים בקטלוג</title>
  <script src="config.js"></script>
  <style>
    :root { --bg:#f3f4f6; --card:#ffffff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --blue:#2563eb; }
    * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    body { margin:0; background:var(--bg); color:var(--text); min-height:100dvh; display:flex; flex-direction:column; }

    header {
      position:sticky; top:0; z-index:20;
      background:var(--card); border-bottom:1px solid var(--border);
      padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.04);
    }
    .header-inner { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
    .top-row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .top-row h1 { margin:0; font-size:18px; }
    .nav-links { display:flex; gap:10px; font-size:13px; }
    .nav-links a { color:var(--blue); text-decoration:none; font-weight:600; }

    .search-bar { display:flex; gap:8px; flex-wrap:wrap; }
    #searchInput {
      flex:1; min-width:220px; padding:12px 14px; font-size:16px;
      border:2px solid #d1d5db; border-radius:10px; outline:none;
    }
    #searchInput:focus { border-color:var(--blue); }
    select, .clear-btn {
      padding:10px 12px; font-size:14px; border:1px solid #d1d5db;
      border-radius:10px; background:white; cursor:pointer;
    }

    .meta-bar {
      max-width:900px; width:100%; margin:10px auto 0; padding:0 16px;
      font-size:13px; color:var(--muted); display:flex; justify-content:space-between;
    }

    main {
      max-width:900px; width:100%; margin:10px auto 24px; padding:0 16px;
      display:flex; flex-direction:column; gap:10px;
    }

    .book-card {
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    }
    .book-info { flex:1; min-width:0; }
    .book-title { font-size:16px; font-weight:700; margin:0 0 4px 0; }
    .book-alt { font-size:13px; color:var(--muted); margin-bottom:4px; direction:ltr; text-align:right; }
    .book-author { font-size:14px; color:#1f2937; margin-bottom:6px; }
    .book-tags { display:flex; gap:6px; flex-wrap:wrap; font-size:12px; }
    .tag { background:#f3f4f6; color:#374151; padding:3px 8px; border-radius:6px; }
    .tag.status { background:#dcfce7; color:#166534; }

    .code-box {
      display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0;
    }
    .code-badge {
      font-family:monospace; font-size:16px; font-weight:700; direction:ltr;
      background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;
      padding:6px 10px; border-radius:8px;
    }
    .map-placeholder {
      font-size:11px; color:var(--muted); text-decoration:none;
    }

    #loadMoreBtn {
      align-self:center; padding:10px 20px; font-size:14px; font-weight:600;
      background:white; border:1px solid #d1d5db; border-radius:10px; cursor:pointer;
      display:none;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="top-row">
        <h1>קטלוג הספרייה</h1>
        <div class="nav-links">
            <a href="search.html">איתור במפה</a>
            <a href="mapping.html">מיפוי מדפים</a>
        </div>
      </div>

      <div class="search-bar">
        <input
          type="search"
          id="searchInput"
          placeholder="חיפוש חופשי: מספר מיון (700.01), מחבר (ר' סעדיה גאון) או שם ספר (האמונות והדעות)..."
          autocomplete="off"
        />
        <select id="sectionFilter">
          <option value="">כל המדורים</option>
        </select>
        <button type="button" id="clearBtn" class="clear-btn">נקה</button>
      </div>
    </div>
  </header>

  <div class="meta-bar">
    <span id="resultCount">טוען קטלוג...</span>
    <span>100.01 – 999.99</span>
  </div>

  <main>
    <div id="resultsList" style="display:flex;flex-direction:column;gap:10px;"></div>
    <button type="button" id="loadMoreBtn">הצג תוצאות נוספות</button>
  </main>

  <script>
    const CATALOG_FILE = (window.APP_CONFIG && window.APP_CONFIG.BOOKS_CATALOG_JSON) || "books_catalog.json";
    const PAGE_SIZE = 60;

    let books = [];
    let currentMatches = [];
    let renderedCount = 0;

    const searchInput = document.getElementById("searchInput");
    const sectionFilter = document.getElementById("sectionFilter");
    const resultCount = document.getElementById("resultCount");
    const resultsList = document.getElementById("resultsList");
    const loadMoreBtn = document.getElementById("loadMoreBtn");

    // Normalize Hebrew & punctuation so partial queries match regardless of geresh/niqqud/double-letters
    function normalizeText(str) {
      if (!str) return "";
      return str
        .toLowerCase()
        .replace(/[\u0591-\u05C7]/g, "")   // strip niqqud
        .replace(/['"׳״\-–—.,:;()[\]/\\]/g, " ")
        .replace(/וו/g, "ו")
        .replace(/יי/g, "י")
        .replace(/\s+/g, " ")
        .trim();
    }

    async function init() {
      try {
        const res = await fetch(CATALOG_FILE);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawBooks = await res.json();

        const sections = new Set();
        books = rawBooks.map((b) => {
          const normTitle = normalizeText(`${b.title || ""} ${b.alt_title || ""} ${b.in_book || ""}`);
          const normAuthor = normalizeText(b.author || "");
          const normSection = normalizeText(b.section || "");
          const normAll = `${b.code} ${normTitle} ${normAuthor} ${normSection} ${normalizeText(b.publisher || "")}`;

          if (b.section) sections.add(b.section);
          return { ...b, _title: normTitle, _author: normAuthor, _all: normAll };
        });

        Array.from(sections).sort((a, b) => a.localeCompare(b, "he")).forEach((sec) => {
          const opt = document.createElement("option");
          opt.value = sec;
          opt.textContent = sec;
          sectionFilter.appendChild(opt);
        });

        runSearch();
        searchInput.focus();
      } catch (err) {
        resultCount.textContent = `שגיאה בטעינת הקטלוג (${err.message})`;
      }
    }

    function scoreBook(book, rawTrimmed, normQuery, tokens, isNumericQuery) {
      if (isNumericQuery) {
        if (book.code === rawTrimmed) return 100;
        if (book.code.startsWith(rawTrimmed)) return 80;
        if (book._all.includes(rawTrimmed)) return 30;
        return 0;
      }

      // Every token must exist somewhere in the book's searchable fields
      for (let i = 0; i < tokens.length; i++) {
        if (!book._all.includes(tokens[i])) return 0;
      }

      let score = 20;
      if (book._title.includes(normQuery)) score += 60;
      else if (tokens.every((t) => book._title.includes(t))) score += 35;

      if (book._author.includes(normQuery)) score += 50;
      else if (tokens.every((t) => book._author.includes(t))) score += 25;

      return score;
    }

    function runSearch() {
      const rawTrimmed = searchInput.value.trim();
      const secVal = sectionFilter.value;
      const normQuery = normalizeText(rawTrimmed);
      const tokens = normQuery ? normQuery.split(" ") : [];
      const isNumericQuery = /^\d{1,3}(\.\d*)?$/.test(rawTrimmed);

      if (!normQuery && !secVal) {
        currentMatches = books;
      } else {
        const scored = [];
        for (let i = 0; i < books.length; i++) {
          const b = books[i];
          if (secVal && b.section !== secVal) continue;
          if (!normQuery) {
            scored.push({ book: b, score: 1 });
            continue;
          }
          const sc = scoreBook(b, rawTrimmed, normQuery, tokens, isNumericQuery);
          if (sc > 0) scored.push({ book: b, score: sc });
        }
        scored.sort((a, b) => b.score - a.score || a.book.code.localeCompare(b.book.code));
        currentMatches = scored.map((s) => s.book);
      }

      resultsList.innerHTML = "";
      renderedCount = 0;
      resultCount.textContent = `נמצאו ${currentMatches.length.toLocaleString()} ספרים`;
      renderNextBatch();
    }

    function renderNextBatch() {
      const slice = currentMatches.slice(renderedCount, renderedCount + PAGE_SIZE);
      const frag = document.createDocumentFragment();

      for (const b of slice) {
        const card = document.createElement("article");
        card.className = "book-card";

        const tags = [];
        if (b.publisher || b.year) tags.push(`<span class="tag">${[b.publisher, b.year].filter(Boolean).join(", ")}</span>`);
        if (b.vols) tags.push(`<span class="tag">${b.vols} כרכים</span>`);
        if (b.copies) tags.push(`<span class="tag">${b.copies} עותקים</span>`);
        if (b.section) tags.push(`<span class="tag">${b.section}</span>`);
        if (b.status) tags.push(`<span class="tag status">${b.status}</span>`);

        card.innerHTML = `
          <div class="book-info">
            <h2 class="book-title">${escapeHtml(b.title || "ללא כותר")}</h2>
            ${b.alt_title ? `<div class="book-alt">${escapeHtml(b.alt_title)}</div>` : ""}
            ${b.in_book ? `<div class="book-alt" style="direction:rtl;">בתוך: ${escapeHtml(b.in_book)}</div>` : ""}
            ${b.author ? `<div class="book-author">${escapeHtml(b.author)}</div>` : ""}
            <div class="book-tags">${tags.join("")}</div>
          </div>
          <div class="code-box">
            <span class="code-badge">${escapeHtml(b.code)}</span>
            <span class="map-placeholder">מיקום במפה (בקרוב)</span>
          </div>
        `;
        frag.appendChild(card);
      }

      resultsList.appendChild(frag);
      renderedCount += slice.length;
      loadMoreBtn.style.display = renderedCount < currentMatches.length ? "block" : "none";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    let debounceTimer;
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runSearch, 120);
    });
    sectionFilter.addEventListener("change", runSearch);
    document.getElementById("clearBtn").addEventListener("click", () => {
      searchInput.value = "";
      sectionFilter.value = "";
      runSearch();
      searchInput.focus();
    });
    loadMoreBtn.addEventListener("click", renderNextBatch);

    init();
  </script>
</body>
</html>
