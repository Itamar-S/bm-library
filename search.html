<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Book — Library Map</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
    body { margin:0; height:100dvh; display:flex; flex-direction:column; background:#f3f4f6; }
    header { background:#fff; padding:12px 16px; border-bottom:1px solid #e5e7eb; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
    input { padding:10px; font-size:17px; font-family:monospace; border:2px solid #d1d5db; border-radius:10px; text-align:center; }
    #codeIn { width:170px; }
    #volIn { width:105px; }
    button { padding:11px 18px; font-size:16px; font-weight:700; background:#2563eb; color:#fff; border:none; border-radius:10px; cursor:pointer; }
    #banner { text-align:center; padding:10px 14px; font-size:15px; font-weight:600; background:#eff6ff; color:#1e40af; border-bottom:1px solid #bfdbfe; display:none; }
    #banner.error { background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    main { flex:1; overflow:auto; display:flex; justify-content:center; align-items:center; padding:14px; touch-action:pan-x pan-y pinch-zoom; }
    main svg { max-width:100%; max-height:100%; height:auto; background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.08); }
    @keyframes pulse { 0%,100% { fill:#ef4444 !important; } 50% { fill:#f97316 !important; } }
    .found, .found * { fill:#ef4444 !important; stroke:#000 !important; stroke-width:3px !important; animation:pulse 1.2s infinite; }
  </style>
</head>
<body>
  <header>
    <input type="text" id="codeIn" inputmode="decimal" placeholder="Book # (603.40)" />
    <input type="number" id="volIn" inputmode="numeric" min="1" placeholder="Vol (opt.)" />
    <button id="findBtn">Locate</button>
  </header>
  <div id="banner"></div>
  <main id="map"></main>

  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY, SVG_FILENAME } = window.APP_CONFIG;
    const db = window.supabase.createClient(
      SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, ""),
      SUPABASE_ANON_KEY.trim()
    );

    let ranges = [];
    const codeIn = document.getElementById("codeIn"), volIn = document.getElementById("volIn"), banner = document.getElementById("banner"), map = document.getElementById("map");

    async function init() {
      const [svgRes, sRes] = await Promise.all([
        fetch("library_map.svg"),
        db.from("shelf_submissions").select("*").order("created_at", { ascending: true }),
      ]);
      map.innerHTML = await svgRes.text();
      if (!sRes.data) return;

      const latestMap = new Map();
      for (const s of sRes.data) {
        if (s.shelf_num >= 1) latestMap.set(`${s.column_id}|${s.shelf_num}`, s);
      }

      ranges = Array.from(latestMap.values())
        .filter((r) => r.status === "indexed")
        .map((r) => ({ col: r.column_id, shelf: Number(r.shelf_num), start: r.start_code, sVol: r.start_vol || 0, end: r.end_code, eVol: r.end_vol || 0 }));
    }

    const formatDewey = (v) => (!v.includes(".") && /^\d{4,}/.test(v.trim())) ? v.trim().slice(0, 3) + "." + v.trim().slice(3) : v.trim().toUpperCase();

    function search() {
      document.querySelectorAll(".found").forEach((el) => el.classList.remove("found"));
      const q = formatDewey(codeIn.value);
      codeIn.value = q;
      if (!q) return;
      const v = parseInt(volIn.value, 10) || 0;

      const matches = ranges.filter((r) =>
        (q > r.start || (q === r.start && (v === 0 || v >= r.sVol))) &&
        (q < r.end || (q === r.end && (v === 0 || r.eVol === 0 || v <= r.eVol)))
      );

      banner.style.display = "block";
      if (!matches.length) { banner.className = "error"; banner.textContent = `Not found: ${q}${v ? " v." + v : ""}`; return; }

      banner.className = "";
      banner.textContent = matches.map((m) => {
        document.getElementById(m.col)?.classList.add("found");
        return `${m.col.toUpperCase()} — Shelf ${m.shelf} (${m.start}${m.sVol ? " v." + m.sVol : ""}–${m.end}${m.eVol ? " v." + m.eVol : ""})`;
      }).join(" | ");
    }

    document.getElementById("findBtn").onclick = search;
    [codeIn, volIn].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") search(); }));
    init();
  </script>
</body>
</html>
